# Meilisearch on the VPS, behind Caddy for TLS, with the embedding model beside it. Local dev
# uses the brew binaries instead (`pnpm meili` + `ollama serve`), so this file only ever runs
# in production.
services:
  meilisearch:
    image: getmeili/meilisearch:v1.53
    restart: unless-stopped
    environment:
      MEILI_ENV: production
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY}
      # Meilisearch refuses to call an embedder on a loopback or private address unless the
      # network is allow-listed — without this every embedder task fails with «Rejected URI»,
      # which is the one error message that does not say what is wrong.
      MEILI_EXPERIMENTAL_ALLOWED_IP_NETWORKS: 127.0.0.0/8,172.16.0.0/12
      # Embedding the query is the whole cost of a hybrid search on one core (~0.55 s). Cached,
      # a repeated query costs nothing, and the second query of a multi-search reuses the first.
      MEILI_EXPERIMENTAL_EMBEDDING_CACHE_ENTRIES: 20000
    volumes:
      - meili_data:/meili_data
    expose:
      - '7700'
    depends_on:
      - ollama

  # Query-time embeddings only. Document vectors are computed on the maintenance machine and
  # pushed with `regenerate: false` (scripts/embed.ts) — one ARM core would need a day and a
  # half for the 99k documents.
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    environment:
      OLLAMA_KEEP_ALIVE: '-1'
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
    volumes:
      - ollama_models:/root/.ollama
    expose:
      - '11434'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - '80:80'
      - '443:443'
    environment:
      SEARCH_DOMAIN: ${SEARCH_DOMAIN:?set SEARCH_DOMAIN}
    command: >
      caddy reverse-proxy --from ${SEARCH_DOMAIN} --to meilisearch:7700
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - meilisearch

volumes:
  meili_data:
  ollama_models:
  caddy_data:
  caddy_config:
